name: Feature request
description: Suggest a useful change
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction and any device or resource constraints.
    validations:
      required: true
