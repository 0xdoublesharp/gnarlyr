name: Bug report
description: Report a reproducible firmware, website, or public-tool problem
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and clear steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build and environment
      description: Include the build/version, full-size ECHO model, or host OS/browser as applicable.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional details
      description: Share only relevant, redacted details. Do not upload private backups or music.
