name: Firmware release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag, matching firmware/identity.json
        required: true
        type: string
      owner_approved:
        description: Required player release checks passed and owner approved this exact release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OWNER_APPROVED: ${{ inputs.owner_approved }}
        run: |
          set -euo pipefail
          test "$OWNER_APPROVED" = true
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$sha" = "$GITHUB_SHA"
          version=$(python3 -c 'import json; print(json.load(open("firmware/identity.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firmware-${{ needs.validate.outputs.sha }}
          path: dist
      - name: Verify and publish exact checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Gnarlyr $RELEASE_TAG" --generate-notes --latest
