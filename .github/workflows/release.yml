name: Firmware release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag, matching firmware/identity.json
        required: true
        type: string
      source_run:
        description: Successful CI run ID containing the exact image tested on the player
        required: true
        type: string
      owner_approved:
        description: Required player release checks passed and owner approved this exact release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: firmware-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.tag }}
          OWNER_APPROVED: ${{ inputs.owner_approved }}
        run: |
          set -euo pipefail
          test "$OWNER_APPROVED" = true
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          version=$(python3 -c 'import json; print(json.load(open("firmware/identity.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/ci.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['head_branch'] in ('main', os.environ['RELEASE_TAG'])
          CHECK
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firmware-${{ needs.validate.outputs.sha }}
          path: dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify and publish exact checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'CHECK'
          import hashlib, json, os
          from pathlib import Path
          dist = Path('dist')
          manifest = json.loads((dist / 'firmware.json').read_text())
          assert manifest['commit'] == os.environ['SOURCE_SHA']
          assert 'v' + manifest['version'] == os.environ['RELEASE_TAG']
          for name in ('ECHOECHO.IMG', 'GNARLYR.IMG', 'gnarlyr-source.tar.gz'):
              data = (dist / name).read_bytes()
              assert manifest['files'][name] == {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          assert (dist / 'ECHOECHO.IMG').read_bytes() == (dist / 'GNARLYR.IMG').read_bytes()
          CHECK
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Gnarlyr $RELEASE_TAG" --generate-notes --latest
