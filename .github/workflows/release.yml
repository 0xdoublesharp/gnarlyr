name: Firmware release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, vMAJOR.MINOR.PATCH from firmware/identity.json, or with a pre-release label such as v1.0.0-beta.1
        required: true
        type: string
      source_run:
        description: Successful CI run on this tag (a pre-release) or main, containing the exact image tested on the player
        required: true
        type: string
      owner_approved:
        description: Required player release checks passed and owner approved this exact release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: firmware-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      label: ${{ steps.tag.outputs.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.tag }}
          OWNER_APPROVED: ${{ inputs.owner_approved }}
        run: |
          set -euo pipefail
          test "$OWNER_APPROVED" = true
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          label=$(python3 tools/release_package.py label "$RELEASE_TAG")
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$sha" = "$GITHUB_SHA"
          if [ -z "$label" ]; then git merge-base --is-ancestor "$sha" refs/remotes/origin/main; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/ci.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['head_branch'] in ('main', os.environ['RELEASE_TAG'])
          CHECK
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firmware-${{ needs.validate.outputs.sha }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify and publish exact checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.label != '' }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          (cd "$dist" && sha256sum --check SHA256SUMS)
          python3 tools/release_package.py verify --dist "$dist" --tag "$RELEASE_TAG" --commit "$SOURCE_SHA"
          python3 tools/release_package.py notes "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          gh release create "$RELEASE_TAG" "$dist"/* --verify-tag --title "Gnarlyr $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"
