name: Long fuzz

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per fuzzer
        default: '5'
      target:
        description: One fuzzer name, or empty for every fuzzer
        default: ''

permissions:
  contents: read

concurrency:
  group: fuzz-long
  cancel-in-progress: false

jobs:
  fuzz:
    name: Long sanitized fuzzing
    if: github.repository == '0xdoublesharp/gnarlyr'
    env:
      CC: clang
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /Volumes/Scratch/SnowskyEcho/data/fuzz-corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-
      - name: Run the campaign
        env:
          MINUTES: ${{ inputs.minutes || '5' }}
          TARGET: ${{ inputs.target || '' }}
        run: |
          set -euo pipefail
          args=(--long --minutes "$MINUTES" --jobs 4)
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          python3 tools/firmware.py fuzz "${args[@]}"
      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /Volumes/Scratch/SnowskyEcho/data/fuzz-corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fuzz-report-${{ github.run_id }}
          path: /Volumes/Scratch/SnowskyEcho/reports/fuzz
          retention-days: 14
          if-no-files-found: warn
