name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Tools, generated assets, and image budgets
    env:
      CC: clang
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Label a pre-release build from its tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          label=$(python3 tools/release_package.py label "$RELEASE_TAG")
          if [ -n "$label" ]; then echo "ECHO_BUILD_TAG=$label" >> "$GITHUB_ENV"; fi
      - name: Check public host tools and website
        run: python3 -m unittest discover -s tests
      - name: Check firmware host tools before ARM scenarios
        run: python3 tools/firmware.py test --jobs 4 --regex '^tools_unit_tests$'
      - name: Check generated assets
        run: python3 tools/firmware.py regen --check --jobs 2
      - name: Check both firmware size budgets
        run: python3 tools/firmware.py sizes --jobs 4
      - name: Package firmware and source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          preset=release
          if [ -n "$RELEASE_TAG" ]; then preset=$(python3 tools/release_package.py preset "$RELEASE_TAG"); fi
          git archive --format=tar.gz --prefix=gnarlyr/ HEAD > "$RUNNER_TEMP/source.tar.gz"
          python3 tools/release_package.py package --image "firmware/build/$preset/GNARLYR.IMG" \
            --source "$RUNNER_TEMP/source.tar.gz" --dist /Volumes/Scratch/SnowskyEcho/dist \
            --commit "$SOURCE_SHA" ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.sha }}
          path: /Volumes/Scratch/SnowskyEcho/dist/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  firmware:
    name: Firmware shard ${{ matrix.shard }}/6
    needs: preflight
    env:
      CC: clang
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Run this shard and its required fixtures
        run: python3 tools/ci_firmware.py --shard "${{ matrix.shard }}" --shards 6 --jobs 4
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  mac-filesystems:
    name: macOS card compatibility
    if: >-
      github.repository == '0xdoublesharp/gnarlyr' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' ||
       (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Require a commit from trusted main before image mounts
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Check native FAT and exFAT mount, read, and write
        run: |
          sudo -E env "PATH=$PATH" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            "$(command -v python3)" tools/firmware.py test --jobs 4 --regex '^(formatted_cards_pass_fsck|created_cards_pass_fsck)$'
