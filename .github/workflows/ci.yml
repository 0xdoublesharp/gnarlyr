name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    paths-ignore: ['**/*.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware and public tools
    env:
      CC: clang
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Check public host tools and website
        run: python3 -m unittest discover -s tests
      - name: Check firmware and emulator
        run: python3 tools/firmware.py test --jobs 4
      - name: Check generated assets
        run: python3 tools/firmware.py regen --check --jobs 2
      - name: Check both firmware size budgets
        run: python3 tools/firmware.py sizes --jobs 4
      - name: Package firmware and source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dist=/Volumes/Scratch/SnowskyEcho/dist
          cp firmware/build/release/GNARLYR.IMG "$dist/GNARLYR.IMG"
          git archive --format=tar.gz --prefix=gnarlyr/ HEAD > "$dist/gnarlyr-source.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dist = Path('/Volumes/Scratch/SnowskyEcho/dist')
          identity = json.loads(Path('firmware/identity.json').read_text())
          files = {path.name: {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'bytes': path.stat().st_size} for path in sorted(dist.iterdir())}
          (dist / 'firmware.json').write_text(json.dumps({'version': identity['version'], 'commit': os.environ['SOURCE_SHA'], 'model': 'SNOWSKY ECHO (full-size)', 'files': files}, indent=2) + '\n')
          PY
          (cd "$dist" && shasum -a 256 GNARLYR.IMG gnarlyr-source.tar.gz firmware.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.sha }}
          path: /Volumes/Scratch/SnowskyEcho/dist/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  mac-filesystems:
    name: macOS card compatibility
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-firmware
      - name: Check native FAT and exFAT mount, read, and write
        run: python3 tools/firmware.py test --jobs 4 --regex '^(formatted_cards_pass_fsck|created_cards_pass_fsck)$'
